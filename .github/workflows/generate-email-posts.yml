name: Generate Email-Only LinkedIn Posts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'    # 6 AM UTC
    - cron: '0 17 * * *'   # 5 PM UTC

jobs:
  generate-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate posts from emails only
        run: python src/main.py --emails-only
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_ENDPOINT: ${{ secrets.GROQ_ENDPOINT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit and push if there are changes
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          mkdir -p posts && git add posts/
          git diff --quiet && git diff --staged --quiet || git commit -m "Add LinkedIn email-based posts for $(date +'%Y-%m-%d')"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:Main
