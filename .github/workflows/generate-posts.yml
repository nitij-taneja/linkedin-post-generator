name: Generate LinkedIn Posts

on:
  workflow_dispatch:  # Manual run
  schedule:
  - cron: '0 10 * * *'
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'
    - cron: '0 21 * * *'

jobs:
  generate-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for proper attribution

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node.js for Mermaid
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Setup Java for PlantUML (optional fallback)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Download PlantUML (optional fallback)
        run: |
          mkdir -p tools
          wget https://github.com/plantuml/plantuml/releases/download/v1.2023.10/plantuml-1.2023.10.jar -O tools/plantuml.jar

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install additional dependencies for image generation
          pip install pillow requests numpy matplotlib sympy

      - name: Create asset directories
        run: |
          mkdir -p assets/stock_images/technology
          mkdir -p assets/stock_images/business
          mkdir -p assets/stock_images/data_science
          mkdir -p assets/stock_images/ai
          mkdir -p assets/stock_images/machine_learning
          mkdir -p assets/stock_images/nlp
          mkdir -p assets/stock_images/mlops
          mkdir -p assets/generated_images
          mkdir -p posts
          mkdir -p images
          mkdir -p analytics

      - name: Create placeholder stock images
        run: |
          # Create placeholder images using Python instead of downloading from external services
          python - <<EOF
          from PIL import Image, ImageDraw, ImageFont
          import os
          import re

          def sanitize_filename(filename):
              # Replace slashes and other unsafe characters with underscores
              return re.sub(r'[\\/*?:"<>|]', '_', filename)

          def create_placeholder(filename, text, bg_color=(240, 240, 240), text_color=(60, 60, 60)):
              # Ensure directory exists
              directory = os.path.dirname(filename)
              os.makedirs(directory, exist_ok=True)
              
              img = Image.new('RGB', (800, 600), color=bg_color)
              draw = ImageDraw.Draw(img)
              
              # Draw border
              draw.rectangle([(20, 20), (780, 580)], outline=text_color, width=2)
              
              # Add text
              try:
                  font = ImageFont.truetype("DejaVuSans.ttf", 40)
              except IOError:
                  font = ImageFont.load_default()
                  
              # Center text
              draw.text((400, 300), text, fill=text_color, font=font, anchor="mm")
              
              # Save image
              img.save(filename)
              print(f"Created {filename}")

          # Create placeholder images for each category
          categories = {
              "technology": ["Tech", "Programming", "Software", "Hardware"],
              "business": ["Business", "Meeting", "Strategy", "Marketing"],
              "data_science": ["Data", "Analytics", "Statistics", "Visualization"],
              "ai": ["AI", "Artificial Intelligence", "Machine Learning", "Neural Network"],
              "machine_learning": ["ML", "Deep Learning", "Algorithm", "Training Model"],
              "nlp": ["NLP", "Text Analysis", "Language Models", "Transformers"],
              "mlops": ["MLOps", "Deployment", "Monitoring", "CI_CD"]  # Fixed CI/CD to CI_CD
          }

          for category, topics in categories.items():
              directory = f"assets/stock_images/{category}"
              os.makedirs(directory, exist_ok=True)
              
              for i, topic in enumerate(topics):
                  # Sanitize the topic name for filename
                  safe_topic = sanitize_filename(topic.lower().replace(' ', '_'))
                  filename = f"{directory}/{safe_topic}.jpg"
                  
                  create_placeholder(filename, f"{topic}", 
                                    bg_color=(240, 245, 250) if i % 2 == 0 else (245, 240, 250),
                                    text_color=(30, 90, 150) if i % 2 == 0 else (90, 30, 150))
          EOF

      - name: Send startup message to Telegram
        run: python src/test_bot_message.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Generate posts from research + email + random topics
        run: python src/main.py --random-topics --num-posts 3
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_ENDPOINT: ${{ secrets.GROQ_ENDPOINT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional self-hosted Stable Diffusion API URL (if available)
          SD_API_URL: ${{ secrets.SD_API_URL }}
          # Optional Hugging Face API URL
          HF_API_URL: ${{ secrets.HF_API_URL }}

      # Get user information for proper attribution
      - name: Get user information
        id: user_info
        run: |
          # Get the repository owner's username
          REPO_OWNER=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 1)
          echo "REPO_OWNER=$REPO_OWNER" >> $GITHUB_ENV
          
          # Get the user's email from GitHub API or use a fallback
          USER_EMAIL=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/users/$REPO_OWNER | jq -r '.email // ""')
          
          # If email is null or empty, use a fallback with the username
          if [ "$USER_EMAIL" = "null" ] || [ -z "$USER_EMAIL" ]; then
            USER_EMAIL="${REPO_OWNER}@users.noreply.github.com"
          fi
          
          echo "USER_EMAIL=$USER_EMAIL" >> $GITHUB_ENV
          echo "USER_NAME=$REPO_OWNER" >> $GITHUB_ENV

      - name: Commit and push if there are changes
        run: |
          # Configure git with the repository owner's information for proper attribution
          git config --global user.email "${{ env.USER_EMAIL }}"
          git config --global user.name "${{ env.USER_NAME }}"
          
          # Add all relevant files
          git add posts/ images/ assets/ analytics/
          
          # Check if there are changes to commit
          if ! git diff --quiet && ! git diff --staged --quiet; then
            # Commit with a descriptive message
            git commit -m "Add LinkedIn posts for $(date +'%Y-%m-%d')"
            
            # Get the default branch name
            DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
            
            # Push to the default branch
            git push origin HEAD:$DEFAULT_BRANCH
            echo "Successfully committed and pushed changes to $DEFAULT_BRANCH branch"
          else
            echo "No changes to commit"
          fi
